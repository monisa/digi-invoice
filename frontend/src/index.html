<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>digi-invoice</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link id="app-favicon" rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <script>
    // Applied before Angular boots so there's no flash of the wrong theme.
    (function () {
      var stored = localStorage.getItem('di_theme');
      var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark-theme');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
